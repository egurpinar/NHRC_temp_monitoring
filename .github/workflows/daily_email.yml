name: Daily Conditions Email

# Sends the daily conditions digest at 1:00 AM Eastern, year-round, so it is in
# inboxes well before anyone leaves for a dawn practice.
#
# WHY THE JOB WAITS INSTEAD OF CHECKING THE CLOCK AND GIVING UP
# -------------------------------------------------------------
# GitHub Actions cron is best effort, and the delays here are severe: a 05:00
# UTC trigger (1:00 AM Eastern) was observed starting at 5:00 AM Eastern, four
# hours late. The old gate then correctly refused to send, because a digest
# arriving after 5 AM helps nobody already at the boathouse -- so members got no
# email at all and the run still reported success. We widened that window once
# before, after the 2026-08-06 miss; widening it again would just trade away
# another hour of usefulness.
#
# So the trigger no longer decides when we send. The job is scheduled hours
# EARLY and scripts/send_window.sh works out what to do:
#
#   before 1 AM  -> sleep until 1 AM, then send
#   1 AM - 5 AM  -> send now (on time, or late but still useful)
#   after 5 AM   -> skip; too late to be worth sending
#
# A punctual start waits; a four-hour delay lands on time. Both send at 1 AM.
#
# The four triggers are independent chances for GitHub to start us at all. The
# first two land in the evening and wait; the last two are safety nets that send
# immediately if they happen to be punctual. Duplicates are prevented by
# scripts/daily_email.js, which asks Buttondown what has already gone out today
# before sending (a slug alone does NOT prevent duplicates -- that assumption
# once sent everyone two copies).

on:
  schedule:
    - cron: '0 1 * * *'   # 9 PM EDT / 8 PM EST  -> waits for 1 AM
    - cron: '0 2 * * *'   # 10 PM EDT / 9 PM EST -> waits for 1 AM
    - cron: '0 5 * * *'   # 1 AM EDT / midnight EST
    - cron: '0 6 * * *'   # 2 AM EDT / 1 AM EST
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build the email but do NOT send it'
        type: boolean
        default: true
      force_off_season:
        description: 'Send even if today falls outside the rowing season'
        type: boolean
        default: false

# Queue rather than cancel. A run that is sleeping until 1 AM must not be killed
# mid-send by a later trigger; the queued run simply starts afterwards, finds
# the digest already sent, and exits.
concurrency:
  group: daily-email
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    # Long enough for the maximum 5-hour wait plus the build and send, and still
    # inside GitHub's 6-hour ceiling.
    timeout-minutes: 330
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Wait for the send window
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run - proceeding immediately."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Started at $(TZ=America/New_York date '+%Y-%m-%d %H:%M %Z')"
          DECISION=$(bash scripts/send_window.sh)
          echo "Decision: $DECISION"

          case "$DECISION" in
            SEND)
              echo "proceed=true" >> "$GITHUB_OUTPUT"
              ;;
            WAIT*)
              SECS=$(echo "$DECISION" | awk '{print $2}')
              echo "Sleeping ${SECS}s until 1:00 AM Eastern..."
              sleep "$SECS"
              echo "Woke at $(TZ=America/New_York date '+%H:%M %Z')"
              echo "proceed=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Run test suite
        if: steps.gate.outputs.proceed == 'true'
        # The rules logic is safety-critical. If the tests fail, do not send.
        run: |
          bash scripts/test_send_window.sh
          node scripts/test_daily_email.js

      - name: Build email (dry run preview)
        if: steps.gate.outputs.proceed == 'true'
        run: |
          node scripts/daily_email.js --json > /tmp/digest.json
          echo "Computed digest:"
          head -40 /tmp/digest.json

      - name: Send via Buttondown
        # The script applies the rowing-season gate itself and exits quietly
        # (success, nothing sent) when today falls outside the season.
        if: steps.gate.outputs.proceed == 'true' && github.event.inputs.dry_run != 'true'
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.force_off_season }}" = "true" ]; then
            node scripts/daily_email.js --send --force
          else
            node scripts/daily_email.js --send
          fi
