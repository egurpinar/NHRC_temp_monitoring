name: Daily Conditions Email

# Sends the daily conditions digest at 1:00 AM Eastern LOCAL time, year-round,
# so it is always in inboxes well before anyone leaves for a dawn practice.
#
# WHY TWO CRON TIMES
# ------------------
# GitHub Actions cron is always UTC and has no timezone support. 1:00 AM Eastern
# is 05:00 UTC during EDT (summer) and 06:00 UTC during EST (winter). We trigger
# at BOTH and let the job check the actual Eastern hour, so the send tracks
# local time across daylight saving. Verified by the DST test in
# scripts/test_daily_email.js.
#
# The twin cron doubles as a free retry: in summer the 06:00 UTC run lands at
# 2 AM Eastern, inside the send window, so if the 1 AM attempt failed it tries
# again an hour later. Duplicates are impossible because the send is idempotent
# (per-day slug, see dailySlug in scripts/daily_email.js).

on:
  schedule:
    - cron: '0 5 * * *'   # 1:00 AM EDT (summer)
    - cron: '0 6 * * *'   # 1:00 AM EST (winter)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build the email but do NOT send it'
        type: boolean
        default: true
      force_off_season:
        description: 'Send even if today falls outside the rowing season'
        type: boolean
        default: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Decide whether this run should proceed
        id: gate
        run: |
          # Manual runs always proceed.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "Manual run — proceeding."
            exit 0
          fi

          # Scheduled runs: proceed during the 01:00-04:59 Eastern window.
          #
          # This used to require exactly the 4 AM hour, which silently dropped
          # the whole day's email whenever GitHub started the job late —
          # scheduled runs on shared runners are routinely delayed by tens of
          # minutes, and the job still reported success, so the failure was
          # invisible. That is why no email arrived on 2026-08-06.
          #
          # The window ends at 04:59 deliberately: a digest arriving after 5 AM
          # is too late to be useful to anyone heading out for a dawn practice,
          # so it is better to skip and be visibly missing than to send stale
          # advice to someone already at the boathouse.
          #
          # A wide window is safe because the send is idempotent: the email
          # carries a per-day slug (nhrc-YYYY-MM-DD) that Buttondown rejects as
          # a duplicate, so the twin cron, a delayed run and a manual retry can
          # all fire and members still receive exactly one email.
          ET_HOUR=$(TZ=America/New_York date +%H)
          echo "Current Eastern hour: $ET_HOUR"
          if [ "$ET_HOUR" -ge 1 ] && [ "$ET_HOUR" -le 4 ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "Within the 1-4 AM Eastern send window — proceeding."
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Outside the 1-4 AM Eastern send window — skipping."
          fi

      - name: Run test suite
        if: steps.gate.outputs.proceed == 'true'
        # The rules logic is safety-critical. If the tests fail, do not send.
        run: node scripts/test_daily_email.js

      - name: Build email (dry run preview)
        if: steps.gate.outputs.proceed == 'true'
        run: |
          node scripts/daily_email.js --json > /tmp/digest.json
          echo "Computed digest:"
          cat /tmp/digest.json | head -40

      - name: Send via Buttondown
        # The script applies the rowing-season gate itself and exits quietly
        # (success, nothing sent) when today falls outside the season.
        if: steps.gate.outputs.proceed == 'true' && github.event.inputs.dry_run != 'true'
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.force_off_season }}" = "true" ]; then
            node scripts/daily_email.js --send --force
          else
            node scripts/daily_email.js --send
          fi
