name: Deploy site to GitHub Pages

# WHY THIS FILE EXISTS
# --------------------
# The temperature bot commits new data every 15 minutes, and every push to main
# queues a Pages deployment. GitHub Pages permits exactly one deployment at a
# time, and its built-in "deploy from a branch" flow has no queueing: when a new
# deployment starts while another is running, one of two things happens —
#
#   "Error: Deployment cancelled."                     (older run discarded), or
#   "Failed to create deployment (status: 400) ...
#    due to in progress deployment"                    (newer run rejected)
#
# — both of which surface as failed red runs even though the site is usually
# fine. Deploying from our own workflow lets us set a concurrency group, which
# is GitHub's documented remedy: one deployment at a time, later pushes queue
# behind it rather than colliding with it.
#
# REQUIRED SETTING: Settings -> Pages -> Source must be "GitHub Actions"
# (not "Deploy from a branch"), otherwise this workflow and the built-in one
# will fight over the same environment.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. cancel-in-progress is deliberately false: an
# in-flight deployment is allowed to finish, and intermediate queued runs are
# superseded by the newest, so the site always converges on the latest commit.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Stage only the files the site actually serves.
      #
      # Uploading the repository root would also upload .git — 41 MB of history
      # here, because the temperature bot rewrites history.json every 15 minutes
      # — versus 1.4 MB of real site files. That made every deployment ~30x
      # larger than necessary and left them sitting in deployment_in_progress.
      # None of .git, .github or scripts is served to browsers.
      - name: Stage site files
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='scripts' \
            --exclude='node_modules' \
            --exclude='_site' \
            --exclude='preview*.html' \
            --exclude='.DS_Store' \
            --exclude='*~' \
            ./ _site/
          echo "Staged $(du -sh _site | cut -f1) across $(find _site -type f | wc -l) files:"
          find _site -maxdepth 1 -printf '  %f\n' | sort

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # .nojekyll keeps the files verbatim and CNAME carries roworno.com;
          # both are dotfile/plain copies preserved by the rsync above.
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
