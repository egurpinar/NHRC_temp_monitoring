name: Fetch Govee Temperature

# WHY THE JOB LOOPS INSTEAD OF RELYING ON THE SCHEDULE
# ----------------------------------------------------
# GitHub Actions schedules are best effort, and on this repository they are
# badly unreliable: a '*/15' cron produced 12-44 runs a day against 96
# scheduled, and once went 49 hours without firing. The website warns when a
# reading is more than 45 minutes old, so those skipped triggers were what
# members kept seeing.
#
# So the trigger no longer decides the sampling rate. Whenever GitHub does start
# us, we keep taking readings every 15 minutes for the next ~3 hours. A single
# trigger in a 3-hour window is now enough for unbroken coverage, and we
# previously observed at worst one run every ~2 hours.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

# One run at a time. A newly triggered run replaces the one already going,
# rather than queueing behind it -- queueing would let a 3-hour job block every
# later trigger. Cancelled runs in the Actions tab are therefore normal and
# expected here, not a sign of failure.
concurrency:
  group: fetch-temp
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    # Slightly above LOOP_MINUTES so the script finishes on its own terms and
    # gets to report, rather than being killed mid-push.
    timeout-minutes: 190
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Poll the Govee sensor and record readings
        env:
          GOVEE_API_KEY: ${{ secrets.GOVEE_API_KEY }}
          # Sensor replaced 2026-08-29. Each physical unit has its own ID; find
          # a new one by running the "List Govee Devices" workflow.
          # Previous sensor: 03:48:01:69:00:00:00:0F:FF:FF:00:57:FF:FF:00:45
          GOVEE_DEVICE: '03:48:01:69:00:00:00:0F:FF:FF:00:45:FF:FF:00:45'
          GOVEE_SKU: H5109
          LOOP_MINUTES: '180'
          SAMPLE_INTERVAL_SECONDS: '900'
          GIT_COMMIT: '1'
        run: bash scripts/fetch_temp.sh
