<script id="theme-init">
// Light or dark, as on roworno.com: the visitor's own choice there (or here),
// otherwise the device's setting - and the season, as there. Decided before
// anything is drawn.
(function () {
  /** Easter Sunday in year y, [month, day] (the Gregorian calendar's rule, as computed by Meeus, Jones and Butcher). */
  function easter(y) {
    var a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4,
        f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30,
        i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
        n = h + l - 7 * m + 114;
    return [Math.floor(n / 31), n % 31 + 1];
  }
  /**
   * The season on the club's calendar (the date in New York): Halloween Oct
   * 15-31, Thanksgiving Nov 15 to the Sunday after Thanksgiving (the fourth
   * Thursday), Christmas Dec 1-25, the New Year Dec 26 - Jan 1, Easter the ten
   * days up to Easter Monday, the Fourth of July Jun 28 - Jul 5; '' the rest
   * of the year.
   */
  function seasonOn(now) {
    var y, mo, d;
    try {
      var p = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', year: 'numeric', month: 'numeric', day: 'numeric' }).formatToParts(now);
      for (var j = 0; j < p.length; j++) {
        if (p[j].type === 'year') y = +p[j].value;
        else if (p[j].type === 'month') mo = +p[j].value;
        else if (p[j].type === 'day') d = +p[j].value;
      }
    } catch (e) { /* no time zones here: the device's own date */ }
    if (!(y && mo && d)) { y = now.getFullYear(); mo = now.getMonth() + 1; d = now.getDate(); }
    var md = mo * 100 + d;
    if (md >= 1015 && md <= 1031) return 'halloween';
    if (md >= 1201 && md <= 1225) return 'christmas';
    if (md >= 1226 || md === 101) return 'newyear';
    if (md >= 628 && md <= 705) return 'july4';
    // The fourth Thursday of November, and its weekend - Christmas has Dec 1.
    if (mo === 11 && d >= 15 && d <= 22 + (11 - new Date(Date.UTC(y, 10, 1)).getUTCDay()) % 7 + 3) return 'thanksgiving';
    var es = easter(y), day = Date.UTC(y, mo - 1, d), sunday = Date.UTC(y, es[0] - 1, es[1]);
    if (day >= sunday - 8 * 864e5 && day <= sunday + 864e5) return 'easter';
    return '';
  }
  /**
   * The season, on every page - its colours (the SEASONS styles) and its
   * pixel art (8bit/seasons.js, at src, fetched only then): the one on the
   * club's calendar, or the one named in the address, to see it on any day
   * (?season=halloween; season=none: none). Word for word the same in
   * index.html and newboathouse/index.html (scripts/test_site_theme.js checks).
   */
  function season(root, q, src) {
    try {
      var m = /(^|&)season=([a-z0-9]*)(&|$)/.exec(q);
      var s = m ? m[2] : seasonOn(new Date());
      if (/^(halloween|thanksgiving|christmas|newyear|easter|july4)$/.test(s)) {
        var art = document.createElement('script');
        art.src = src;
        art.async = true;
        // Not there (no signal, say): the year-round look, not an empty space above the header.
        art.onerror = function () { root.removeAttribute('data-season'); };
        document.head.appendChild(art);
        root.setAttribute('data-season', s);
      }
    } catch (e) { /* the year-round look */ }
  }
  var root = document.documentElement, q = '';
  try { q = String(location.search).replace(/^\?/, ''); } catch (e) { /* no address to read */ }
  var t = null;
  try { t = localStorage.getItem('nhrc-theme'); } catch (e) { /* storage blocked */ }
  if (t !== 'light' && t !== 'dark') {
    t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  root.setAttribute('data-theme', t);
  // The art from the site's own folder: the one address this page's CSP lets a script come from.
  season(root, q, '../8bit/seasons.js');
})();
</script>

<script id="page">
'use strict';
// The timelapse lives on the club's Worker (camera/cloudflare_worker.js): the
// list of days at index.json - the continuous timelapse in chunks, and each
// day's own video - beside them. The list is checked before anything in it is
// used, and shown only as text.
const TIMELAPSE_BASE = 'https://nhrc-camera.gurpinar-emre.workers.dev/timelapse/';
const INDEX_URL = TIMELAPSE_BASE + 'index.json';
const LOAD_TIMEOUT_MS = 10000;
const LOOP_PAUSE_MS = 1500;     // on the last frame, before it starts again from the first day
// A page left open: each evening the newest chunk is made again, under a new
// name, and the old one deleted. The list is read again on the way back to the
// first day (at most this often), and when a video will not play.
const REREAD_MS = 10 * 60 * 1000;
const REREAD_ON_ERROR_MS = 30 * 1000;
const DEFAULT_RATE = 2;
// Safari has kept one picture on screen while the video's clock ran on. Playing
// this long with nothing new shown, the video is moved to where it is, which
// makes it draw again - not more often than this, nor more than twice a chunk.
const STUCK_MS = 1500;
const NUDGE_EVERY_MS = 3000;
const NUDGES_PER_CHUNK = 2;
const THEME_KEY = 'nhrc-theme';
const WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

/** A real calendar day, YYYY-MM-DD. */
function validDate(s) {
  const m = /^(\d{4})-(\d\d)-(\d\d)$/.exec(typeof s === 'string' ? s : '');
  if (!m) return false;
  const t = new Date(Date.UTC(Number(m[1]), Number(m[2]) - 1, Number(m[3])));
  return t.getUTCMonth() === Number(m[2]) - 1 && t.getUTCDate() === Number(m[3]);
}

/**
 * The days in the list that are well formed - their video and poster on the
 * Worker, under their own day's name - newest first. Anything else is left out.
 */
function daysFrom(index) {
  const list = index && Array.isArray(index.days) ? index.days : [];
  const hhmm = /^([01]\d|2[0-3]):[0-5]\d$/;
  const out = [];
  for (const d of list) {
    if (!d || typeof d !== 'object' || !validDate(d.date)) continue;
    const video = typeof d.video === 'string' && new RegExp(`^videos/${d.date}-[0-9a-f]{8,16}\\.mp4$`).test(d.video) ? d.video : null;
    if (!video) continue;
    const poster = typeof d.poster === 'string' && new RegExp(`^posters/${d.date}-[0-9a-f]{8,16}\\.jpg$`).test(d.poster) ? d.poster : null;
    out.push({
      date: d.date, video, poster,
      frames: Number.isInteger(d.frames) && d.frames > 0 ? d.frames : null,
      first: hhmm.test(d.first) ? d.first : null,
      last: hhmm.test(d.last) ? d.last : null,
      seconds: typeof d.seconds === 'number' && d.seconds > 0 ? d.seconds : null,
    });
  }
  out.sort((a, b) => (a.date < b.date ? 1 : -1));
  return out.filter((d, i) => i === 0 || d.date !== out[i - 1].date);
}

/**
 * The continuous timelapse from the list: { fps, total, chunks: [{ start,
 * video, frames, offset, days: [{ date, times: ['0700', ...], offset }] }] } -
 * offsets counted in frames from the very first - or null when there is none.
 * A chunk that is not well formed ends it there: what is shown is always one
 * unbroken run of days, from the first.
 */
function timelineFrom(index) {
  const t = index && index.timeline;
  if (!t || typeof t !== 'object' || !Number.isInteger(t.fps) || t.fps < 1 || t.fps > 60 || !Array.isArray(t.chunks)) return null;
  const chunks = [];
  let offset = 0;
  for (const c of t.chunks) {
    if (!c || typeof c !== 'object' || !validDate(c.start)) break;
    if (typeof c.video !== 'string' || !new RegExp(`^whole/${c.start}-[0-9a-f]{8,16}\\.mp4$`).test(c.video)) break;
    if (chunks.length && c.start <= chunks[chunks.length - 1].start) break;
    if (!Array.isArray(c.days) || !c.days.length) break;
    const days = [];
    let n = 0, ok = true;
    for (const d of c.days) {
      const times = d && typeof d.times === 'string' && /^\d{4}(,\d{4})*$/.test(d.times) ? d.times.split(',') : null;
      if (!d || !validDate(d.date) || !times || (days.length && d.date <= days[days.length - 1].date)
          || times.some((x) => !/^([01]\d|2[0-3])[0-5]\d$/.test(x))) { ok = false; break; }
      days.push({ date: d.date, times, offset: offset + n });
      n += times.length;
    }
    if (!ok || n !== c.frames) break;
    chunks.push({ start: c.start, video: c.video, frames: n, offset, days });
    offset += n;
  }
  return chunks.length ? { fps: t.fps, total: offset, chunks } : null;
}

/** Where frame g of the whole timelapse is: { chunk (its number), local (frame in it), date, hhmm }. */
function frameAt(tl, g) {
  const total = tl.total;
  g = Math.max(0, Math.min(total - 1, Math.floor(Number(g) || 0)));
  let ci = 0;
  while (ci + 1 < tl.chunks.length && tl.chunks[ci + 1].offset <= g) ci++;
  const c = tl.chunks[ci];
  let di = 0;
  while (di + 1 < c.days.length && c.days[di + 1].offset <= g) di++;
  const d = c.days[di];
  return { chunk: ci, local: g - c.offset, date: d.date, hhmm: d.times[g - d.offset] };
}

/**
 * The frame of a day and time in a timelapse - in a newer list, where the page
 * was: that day's frame at that time, or the one before it; a day no longer
 * there, `fallback` (kept within the timelapse).
 */
function frameOf(tl, date, hhmm, fallback) {
  for (const c of tl.chunks) {
    for (const d of c.days) {
      if (d.date !== date) continue;
      let i = 0;
      while (i + 1 < d.times.length && d.times[i + 1] <= hhmm) i++;
      return d.offset + i;
    }
  }
  return Math.max(0, Math.min(tl.total - 1, Math.floor(Number(fallback) || 0)));
}

/** Two lists' continuous timelapses are the same videos, frame for frame. */
function sameTimeline(a, b) {
  return !!a && !!b && a.total === b.total && a.chunks.length === b.chunks.length && a.chunks.every((c, i) => c.video === b.chunks[i].video);
}

/** "Monday, November 9, 2026". */
function dayTitle(date) {
  const [y, m, d] = date.split('-').map(Number);
  return `${WEEKDAYS[new Date(Date.UTC(y, m - 1, d)).getUTCDay()]}, ${MONTHS[m - 1]} ${d}, ${y}`;
}

/** "Mon, Nov 9" - for the list. */
function shortDay(date) {
  const [y, m, d] = date.split('-').map(Number);
  return `${WEEKDAYS[new Date(Date.UTC(y, m - 1, d)).getUTCDay()].slice(0, 3)}, ${MONTHS[m - 1].slice(0, 3)} ${d}`;
}

/** "Nov 9, 2026". */
function mediumDay(date) {
  const [y, m, d] = date.split('-').map(Number);
  return `${MONTHS[m - 1].slice(0, 3)} ${d}, ${y}`;
}

/** "06:35" or "0635" -> "6:35 AM". */
function clock12(hhmm) {
  const s = String(hhmm).replace(':', '');
  const h = Number(s.slice(0, 2));
  return `${h % 12 === 0 ? 12 : h % 12}:${s.slice(2, 4)} ${h < 12 ? 'AM' : 'PM'}`;
}

/** "Mon, Nov 9, 2026 · 7:05 AM" - where the drag bar is. */
function whenText(date, hhmm) {
  return `${shortDay(date)}, ${date.slice(0, 4)} · ${clock12(hhmm)}`;
}

/** "112 photos, 6:35 AM to 4:15 PM - 11 seconds". */
function dayNote(d) {
  const parts = [];
  if (d.frames) parts.push(`${d.frames} photo${d.frames === 1 ? '' : 's'}`);
  if (d.first && d.last) parts.push(`${clock12(d.first)} to ${clock12(d.last)}`);
  let s = parts.join(', ');
  if (d.seconds) {
    const n = Math.max(1, Math.round(d.seconds));
    s += `${s ? ' - ' : ''}${n} second${n === 1 ? '' : 's'}`;
  }
  return s;
}

/** The continuous timelapse's title: "Oct 14, 2026 to Nov 10, 2026 Timelapse" - or the one day's. */
function spanTitle(tl) {
  const first = tl.chunks[0].days[0].date;
  const lastChunk = tl.chunks[tl.chunks.length - 1];
  const last = lastChunk.days[lastChunk.days.length - 1].date;
  return `${first === last ? mediumDay(first) : `${mediumDay(first)} to ${mediumDay(last)}`} Timelapse`;
}

/** Over the days below: "Last 2 days". */
function lastDays(n) {
  return `Last ${n} day${n === 1 ? '' : 's'}`;
}

/** The day the address asks for (#2026-11-09), if it is in the list; else null. */
function askedDay(days, hash) {
  const want = String(hash || '').replace(/^#/, '');
  return days.find((d) => d.date === want) || null;
}

/** The day the address asks for, if it is in the list; else the newest. */
function pickDay(days, hash) {
  return askedDay(days, hash) || days[0] || null;
}

// ─── On the page ─────────────────────────────────────────────────────────────

const $ = (id) => document.getElementById(id);
const show = (id, on) => { const el = $(id); if (el) el.hidden = !on; };
function say(id, text, problem) {
  const el = $(id);
  el.textContent = text;
  el.className = problem ? 'message problem' : 'message';
  el.hidden = !text;
}

// ── The continuous timelapse: two videos, one in front showing a chunk, the
//    other behind it with the next, so one day runs into the next across
//    chunks. ──

// It plays at twice the speed to start with (DEFAULT_RATE; the 2x button is marked in the page).
const P = { tl: null, vis: null, hid: null, playing: false, dragging: false, wasPlaying: false, rate: DEFAULT_RATE, raf: 0, loop: 0, pending: null,
  drawPending: false, playId: 0 };
// The list as read: when, and a reading under way (one at a time).
const L = { readAt: 0, reading: null };
// Each video's chunk: whether it has a picture yet, and the time it is to show
// once it has. Nothing is moved while a video loads (Safari has had bugs with
// seeks made then): it starts where its address says (#t=).
const V = { pictured: new Set(), want: new Map() };

function chunkOf(video) { return video && video.getAttribute('data-chunk') !== null ? Number(video.getAttribute('data-chunk')) : -1; }

/** The middle of frame `local` of a chunk, in seconds. */
function timeOf(local) { return (Math.max(0, local) + 0.5) / P.tl.fps; }

/** The speed for a video - kept when it loads another chunk (some browsers reset playbackRate to the default then). */
function setRate(video) {
  try {
    video.defaultPlaybackRate = P.rate;
    video.playbackRate = P.rate;
  } catch (e) { /* a speed this browser cannot play: it keeps the one it has */ }
}

/** Puts chunk ci into a video, to start at its frame `local`, unless the chunk is there already. */
function load(video, ci, local) {
  if (ci < 0 || ci >= P.tl.chunks.length || chunkOf(video) === ci) return;
  const t = timeOf(local || 0);
  video.setAttribute('data-chunk', String(ci));
  V.pictured.delete(video);
  V.want.set(video, t);
  video.src = `${TIMELAPSE_BASE}${P.tl.chunks[ci].video}#t=${t.toFixed(3)}`;
  setRate(video);
}

/** A video to time t, unless it is there already. */
function goTo(video, t) {
  if (Math.abs((Number(video.currentTime) || 0) - t) > 0.001) video.currentTime = t;
}

/** Shows frame `local` of a video's chunk: now, or once the chunk has a picture. */
function seek(video, local) {
  const t = timeOf(local);
  if (!V.pictured.has(video)) { V.want.set(video, t); return; }
  V.want.delete(video);
  goTo(video, t);
}

/** A video's chunk has its first picture: the frame wanted meanwhile, if that is not the one there - and no poster from now on. */
function onPicture(video) {
  // From the chunk before (the new one still loading), or said already.
  if (!(video.readyState >= 2) || V.pictured.has(video)) return;
  V.pictured.add(video);
  video.removeAttribute('poster');
  if (V.want.has(video)) {
    const t = V.want.get(video);
    V.want.delete(video);
    goTo(video, t);
  }
}

/** The list again (one reading at a time): the index, or null when it cannot be had. */
function reread() {
  if (!L.reading) {
    L.reading = loadIndex().then((index) => index, () => null).then((index) => { L.readAt = Date.now(); L.reading = null; return index; });
  }
  return L.reading;
}

/**
 * A newer continuous timelapse in the list - a new day, or the newest chunk
 * made again: carried on with, from the same day and time. True when there was one.
 */
async function takeNewer() {
  const index = await reread();
  const tl = index && timelineFrom(index);
  if (!tl || sameTimeline(tl, P.tl)) return false;
  const was = frameAt(P.tl, P.dragging && P.pending !== null ? P.pending : currentFrame());
  const g = frameOf(tl, was.date, was.hhmm, currentFrame());
  // A video keeps its chunk only where that chunk is still the very same video.
  for (const v of [P.vis, P.hid]) {
    const ci = chunkOf(v);
    if (ci >= 0 && !(ci < tl.chunks.length && tl.chunks[ci].video === P.tl.chunks[ci].video)) v.removeAttribute('data-chunk');
  }
  P.tl = tl;
  describe(tl);
  showFrame(g);
  return true;
}

/** The video behind to the front; the one in front behind it, paused (see-through: #stage's style). */
function swap() {
  const was = P.vis;
  P.vis = P.hid;
  P.hid = was;
  P.vis.removeAttribute('aria-hidden');
  P.hid.setAttribute('aria-hidden', 'true');
  try { P.hid.pause(); } catch (e) { /* not playing */ }
}

/** Frame g of the whole timelapse in front, the next chunk made ready behind it. */
function showFrame(g) {
  const at = frameAt(P.tl, g);
  if (chunkOf(P.vis) !== at.chunk) {
    // Nothing in front yet: there. Otherwise behind (if not there already), then to the
    // front - the chunk in front going behind, where it is often the next one.
    if (chunkOf(P.vis) < 0 && chunkOf(P.hid) !== at.chunk) load(P.vis, at.chunk, at.local);
    else { load(P.hid, at.chunk, at.local); swap(); }
  }
  seek(P.vis, at.local);
  load(P.hid, at.chunk + 1, 0);
  mark(g);
}

/** The drag bar and the words under it, at frame g. */
function mark(g) {
  const at = frameAt(P.tl, g);
  const range = $('tl-range');
  if (!P.dragging) range.value = String(g);
  const text = whenText(at.date, at.hhmm);
  $('tl-when').textContent = text;
  range.setAttribute('aria-valuetext', text);
}

/** The frame in front now: by the playing video's clock - or, while its chunk loads, the frame it is to show. */
function currentFrame() {
  const ci = chunkOf(P.vis);
  if (ci < 0) return 0;
  const c = P.tl.chunks[ci];
  const t = V.want.has(P.vis) ? V.want.get(P.vis) : (Number(P.vis.currentTime) || 0);
  return c.offset + Math.max(0, Math.min(c.frames - 1, Math.floor(t * P.tl.fps + 1e-6)));
}

// Each video's pictures shown so far (counted where the browser says when it
// shows one), and the watch on the one in front: since when it has played on
// with no new picture, from where, and its nudges.
const F = { shown: new Map(), watch: null, nudges: new Map() };

/** Counts the pictures a video shows, where the browser can say (requestVideoFrameCallback). */
function countPictures(video) {
  if (typeof video.requestVideoFrameCallback !== 'function') return;
  F.shown.set(video, 0);
  const seen = () => { F.shown.set(video, F.shown.get(video) + 1); video.requestVideoFrameCallback(seen); };
  video.requestVideoFrameCallback(seen);
}

/** The stage at least partly on the screen (off it, a browser may well not draw). */
function stageInView() {
  const stage = $('stage');
  if (!stage || typeof stage.getBoundingClientRect !== 'function') return false;
  const r = stage.getBoundingClientRect();
  return r.bottom > 0 && r.top < (Number(window.innerHeight) || 0);
}

/**
 * The video in front playing on, its clock a second or more past the picture
 * on screen, with no new picture for STUCK_MS: moved to where it is, so it
 * draws again.
 */
function unstick() {
  const v = P.vis;
  if (!F.shown.has(v)) return;
  const now = Date.now(), t = Number(v.currentTime) || 0, shown = F.shown.get(v);
  const w = F.watch;
  // Not playing on (paused, moving, loading, out of sight), or a new picture since: the watch starts again.
  if (v.paused || v.seeking || !(v.readyState >= 3) || !stageInView() || !w || w.video !== v || w.shown !== shown || t < w.from) {
    F.watch = { video: v, shown, since: now, from: t };
    return;
  }
  if (now - w.since < STUCK_MS || t - w.from < 1) return;
  const n = F.nudges.get(v) || { chunk: -1, count: 0, at: 0 };
  if (n.chunk !== chunkOf(v)) Object.assign(n, { chunk: chunkOf(v), count: 0 });
  if (n.count >= NUDGES_PER_CHUNK || now - n.at < NUDGE_EVERY_MS) return;
  Object.assign(n, { count: n.count + 1, at: now });
  F.nudges.set(v, n);
  F.watch = { video: v, shown, since: now, from: t };
  try { v.currentTime = t; } catch (e) { /* it plays on as it was */ }
}

function setPlaying(on) {
  P.playing = on;
  const b = $('tl-play');
  b.setAttribute('data-state', on ? 'playing' : 'paused');
  b.setAttribute('aria-label', on ? 'Pause' : 'Play');
  if (!on) return;
  const tick = () => {
    if (!P.playing) return;
    mark(currentFrame());
    unstick();
    P.raf = requestAnimationFrame(tick);
  };
  cancelAnimationFrame(P.raf);
  P.raf = requestAnimationFrame(tick);
}

function play() {
  clearTimeout(P.loop);
  // On the last frame of a chunk its video counts as over: playing it would start
  // that chunk again from its first day. On into the next chunk instead - or, on
  // the last frame of all, as when the timelapse gets there by itself.
  const g = currentFrame();
  const at = frameAt(P.tl, g);
  const c = P.tl.chunks[at.chunk];
  if (c.frames > 1 && at.local === c.frames - 1) {
    if (at.chunk + 1 >= P.tl.chunks.length) { setPlaying(true); theEnd(); return; }
    showFrame(g + 1);
  }
  setPlaying(true);
  const id = ++P.playId;
  const v = P.vis;
  let r;
  try { r = v.play(); } catch (e) { r = null; }
  // A browser that will not start a video by itself (data saving, say): the button says Play.
  if (r && typeof r.catch === 'function') r.catch(() => { if (id === P.playId && v === P.vis && v.paused) setPlaying(false); });
}

function pause() {
  clearTimeout(P.loop);
  setPlaying(false);
  try { P.vis.pause(); } catch (e) { /* not playing */ }
  // The words and the bar at the frame it stopped on: the last ones drawn while it
  // played can be a frame or more behind (at 8x, or a page the browser draws less often).
  mark(currentFrame());
}

/** Today's last frame: a moment on it, then the first day again. */
function theEnd() {
  mark(P.tl.total - 1);
  if (!P.playing) return;
  clearTimeout(P.loop);
  P.loop = setTimeout(async () => {
    // A page left open: the list again before starting over - a new day joins in.
    if (Date.now() - L.readAt >= REREAD_MS) {
      try { await takeNewer(); } catch (e) { /* the timelapse as it was */ }
    }
    if (!P.playing) return;
    showFrame(0);
    play();
  }, LOOP_PAUSE_MS);
}

/** The playing chunk has ended: the next one at once - or, after the last, the end. */
function onEnded(e) {
  if (e && e.target !== P.vis) return;
  const ci = chunkOf(P.vis);
  if (ci >= 0 && ci + 1 < P.tl.chunks.length) {
    showFrame(P.tl.chunks[ci + 1].offset);
    if (P.playing) play();
    return;
  }
  theEnd();
}

/**
 * A video that will not play - most often a chunk made again since the list
 * was read, its old video deleted: the list again (not more than every 30 s),
 * and on from the same frame. Said only when that does not help.
 */
async function onVideoError(v) {
  let took = false;
  if (Date.now() - L.readAt >= REREAD_ON_ERROR_MS) {
    try { took = await takeNewer(); } catch (e) { took = false; }
  }
  if (took) {
    say('tl-message', '', false);
    if (P.playing) play();
    return;
  }
  if (v === P.vis) say('tl-message', 'Part of the timelapse could not be played just now. Please try again in a few minutes.', true);
}

/** The title (the days it spans), the drag bar's ends and its length, for a timelapse. */
function describe(tl) {
  $('tl-range').max = String(tl.total - 1);
  const first = tl.chunks[0].days[0].date;
  const lastChunk = tl.chunks[tl.chunks.length - 1];
  const last = lastChunk.days[lastChunk.days.length - 1].date;
  $('whole-title').textContent = spanTitle(tl);
  $('tl-ends').textContent = first === last ? '' : `${mediumDay(first)} → ${mediumDay(last)}`;
}

function initTimeline(tl, autoplay, startAt, poster) {
  P.tl = tl;
  P.vis = $('tl-a');
  P.hid = $('tl-b');
  const range = $('tl-range');
  describe(tl);
  show('stage', true);
  show('tl-controls', true);
  for (const v of [P.vis, P.hid]) {
    v.addEventListener('ended', onEnded);
    v.addEventListener('error', () => { onVideoError(v); });
    for (const type of ['loadeddata', 'canplay', 'seeked']) v.addEventListener(type, () => { onPicture(v); });
    countPictures(v);
  }
  $('tl-play').addEventListener('click', () => {
    if (P.playing) { pause(); return; }
    if (currentFrame() >= P.tl.total - 1) showFrame(0);
    play();
  });
  // Dragging: the frame under the finger at once; playing again on letting go, if it was.
  range.addEventListener('input', () => {
    if (!P.dragging) { P.dragging = true; P.wasPlaying = P.playing; if (P.playing) pause(); }
    P.pending = Number(range.value);
    if (!P.drawPending) {
      P.drawPending = true;
      requestAnimationFrame(() => { P.drawPending = false; if (P.pending !== null) { showFrame(P.pending); P.pending = null; } });
    }
  });
  // Letting go: "change" - or the finger or button coming up, should a browser
  // not say "change" (a touch taken over by scrolling, say).
  const letGo = (e) => {
    if (!P.dragging) {
      // "Changed" with no dragging before it, from a browser that says only that: the frame let go on.
      if (e && e.type === 'change' && Number(range.value) !== currentFrame()) {
        showFrame(Number(range.value));
        if (P.playing) play();
      }
      return;
    }
    if (P.pending !== null) { showFrame(P.pending); P.pending = null; }
    P.dragging = false;
    if (P.wasPlaying) play();
  };
  for (const type of ['change', 'pointerup', 'pointercancel', 'touchend', 'touchcancel', 'mouseup']) range.addEventListener(type, letGo);
  const speeds = [...document.querySelectorAll('#tl-speeds button')];
  for (const b of speeds) {
    b.addEventListener('click', () => {
      const was = P.rate;
      P.rate = Number(b.getAttribute('data-rate')) || 1;
      setRate(P.vis);
      // A speed the browser would not take: the one it had stays, and stays marked.
      if (P.vis.playbackRate !== P.rate) P.rate = was;
      setRate(P.vis);
      setRate(P.hid);
      for (const o of speeds) o.setAttribute('aria-pressed', Number(o.getAttribute('data-rate')) === P.rate ? 'true' : 'false');
    });
  }
  $('tl-full').addEventListener('click', () => {
    const stage = $('stage');
    try {
      const r = stage.requestFullscreen ? stage.requestFullscreen() : stage.webkitRequestFullscreen ? stage.webkitRequestFullscreen()
        : P.vis.webkitEnterFullscreen ? P.vis.webkitEnterFullscreen() : null;
      if (r && typeof r.catch === 'function') r.catch(() => {});
    } catch (e) { /* not on this browser */ }
  });
  showFrame(startAt);
  // A picture until the first chunk has one (the day it starts on): gone then.
  if (poster) P.vis.setAttribute('poster', TIMELAPSE_BASE + poster);
  if (autoplay) play(); else setPlaying(false);
}

// ── Each whole day, below. ──

// The day shown below.
const D = { current: null };

function selectDay(d, push) {
  D.current = d;
  const player = $('day-player');
  $('day-title').textContent = dayTitle(d.date);
  $('day-note').textContent = dayNote(d);
  if (d.poster) player.setAttribute('poster', TIMELAPSE_BASE + d.poster); else player.removeAttribute('poster');
  player.src = TIMELAPSE_BASE + d.video;
  say('day-message', '', false);
  for (const b of document.querySelectorAll('#days button')) b.setAttribute('aria-current', b.getAttribute('data-date') === d.date ? 'true' : 'false');
  if (push) { try { history.replaceState(null, '', `#${d.date}`); } catch (e) { /* only the address */ } }
}

function renderDays(days) {
  $('day-label').textContent = lastDays(days.length);
  const list = $('days');
  list.textContent = '';
  for (const d of days) {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('data-date', d.date);
    b.setAttribute('aria-label', `Watch ${dayTitle(d.date)}`);
    if (d.poster) {
      const img = document.createElement('img');
      img.loading = 'lazy';
      img.alt = '';
      img.src = TIMELAPSE_BASE + d.poster;
      b.appendChild(img);
    }
    const name = document.createElement('span');
    name.textContent = shortDay(d.date);
    b.appendChild(name);
    if (d.frames) {
      const small = document.createElement('small');
      small.textContent = `${d.frames} photos`;
      b.appendChild(small);
    }
    b.addEventListener('click', () => {
      selectDay(d, true);
      try { $('day-card').scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) { /* old browser */ }
    });
    li.appendChild(b);
    list.appendChild(li);
  }
}

async function loadIndex() {
  const ctrl = typeof AbortController === 'function' ? new AbortController() : null;
  const timer = setTimeout(() => { if (ctrl) ctrl.abort(); }, LOAD_TIMEOUT_MS);
  try {
    // Asked afresh each time (the Worker answers "not changed" when it is not): a cached list can name videos already replaced.
    const res = await fetch(INDEX_URL, { cache: 'no-cache', signal: ctrl ? ctrl.signal : undefined });
    if (res.status === 404) return { days: [] };
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

function reducedMotion() {
  try { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { return false; }
}

async function start() {
  let index;
  try {
    index = await loadIndex();
    L.readAt = Date.now();
  } catch (e) {
    $('whole-title').textContent = 'The timelapse could not be loaded';
    say('tl-message', 'It could not be reached just now. Please try again in a few minutes.', true);
    return;
  }
  const days = daysFrom(index);
  const tl = timelineFrom(index);
  const asked = askedDay(days, location.hash);
  if (!tl) {
    $('whole-title').textContent = 'No timelapse yet';
    say('tl-message', days.length ? 'The timelapse of every day so far starts with the next day that is filmed.'
      : 'The first video appears the evening after the camera\'s first full day of photos.', false);
  } else {
    // A link to a day (the morning email's) shows that day; otherwise everything plays, from the first day.
    let startAt = 0;
    if (asked) {
      const at = tl.chunks.flatMap((c) => c.days).find((d) => d.date === asked.date);
      if (at) startAt = at.offset;
    }
    const startDay = days.find((d) => d.date === frameAt(tl, startAt).date);
    initTimeline(tl, !asked && !reducedMotion(), startAt, startDay && startDay.poster);
  }
  if (days.length) {
    show('day-card', true);
    renderDays(days);
    selectDay(pickDay(days, location.hash), false);
    if (asked) { try { $('day-card').scrollIntoView({ block: 'start' }); } catch (e) { /* old browser */ } }
  }
}

/**
 * A day's video that will not play - most often made again since the list was
 * read (a late frame), the old one deleted: the list again, and the new one.
 */
async function onDayError() {
  const was = D.current;
  if (was && Date.now() - L.readAt >= REREAD_ON_ERROR_MS) {
    let index = null;
    try { index = await reread(); } catch (e) { index = null; }
    const days = index ? daysFrom(index) : [];
    const now = days.find((d) => d.date === was.date);
    if (now && now.video !== was.video) {
      renderDays(days);
      selectDay(now, false);
      return;
    }
  }
  say('day-message', 'This day\'s video could not be played. Please try again later, or pick another day.', true);
}

function initDayPlayer() {
  $('day-player').addEventListener('error', () => { onDayError(); });
}

// Light / dark, as on roworno.com - the same choice, kept for both pages.
function currentTheme() { return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark'; }
/** The page's colour as drawn - the season's, in season - for the browser's own bar on phones. */
function pageColour() {
  try {
    const c = window.getComputedStyle(document.documentElement).getPropertyValue('--navy').trim();
    if (/^#[0-9a-f]{6}$/i.test(c)) return c;
  } catch (e) { /* the theme's own */ }
  return currentTheme() === 'light' ? '#f2f5f9' : '#0d1f3c';
}
function updateThemeToggle() {
  const btn = $('theme-toggle');
  const label = `Switch to ${currentTheme() === 'dark' ? 'light' : 'dark'} mode`;
  btn.setAttribute('aria-label', label);
  btn.setAttribute('title', label);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', pageColour());
}
function initThemeToggle() {
  $('theme-toggle').addEventListener('click', () => {
    const next = currentTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* this visit only */ }
    updateThemeToggle();
  });
  updateThemeToggle();
}

if (typeof window !== 'undefined' && typeof document !== 'undefined' && document.getElementById) {
  window.addEventListener('DOMContentLoaded', () => {
    try { initThemeToggle(); } catch (e) { /* the switch only */ }
    try { initDayPlayer(); } catch (e) { /* the day player's message only */ }
    start();
  });
  window.addEventListener('hashchange', () => {
    // A link to another day (#2026-11-08) while the page is open.
    const want = location.hash.replace(/^#/, '');
    const b = [...document.querySelectorAll('#days button')].find((x) => x.getAttribute('data-date') === want);
    if (b) b.click();
  });
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { TIMELAPSE_BASE, INDEX_URL, LOOP_PAUSE_MS, REREAD_MS, REREAD_ON_ERROR_MS, validDate, daysFrom, timelineFrom, frameAt, frameOf,
    sameTimeline, dayTitle, shortDay, mediumDay, clock12, whenText, dayNote, spanTitle, lastDays, askedDay, pickDay };
}
</script>
